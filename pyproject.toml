[project]
name = "attendance-service-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.16.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "deepface>=0.0.95",
    "fastapi[standard]>=0.116.1",
    "pendulum>=3.1.0",
    "pgvector>=0.4.1",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "reportlab>=4.4.3",
    "scalar-fastapi>=1.3.0",
    "sqlmodel>=0.0.24",
]

# Configuración correcta para uv según documentación oficial
[tool.uv]
constraint-dependencies = [
    "tensorflow-cpu==2.15.1",
    "tensorflow-io-gcs-filesystem==0.31.0",
    "tensorflow-estimator==2.15.0",
    "tensorboard==2.15.2",
    "keras==2.15.0",
    "numpy>=1.21.0,<2.0",
    "opencv-python>=4.5.0,<5.0",
    "pillow>=8.2.0,<11.0",
    "protobuf>=3.19.0,<5.0",
    "wrapt>=1.11.0,<2.0"
]

[tool.ruff]
ignore = ["FAST001"]
